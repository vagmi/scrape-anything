<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrape Anything — Dashboard</title>
  </head>
  <body class="h-full bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <div class="mx-auto max-w-6xl p-4">
      <header class="mb-4 flex items-baseline gap-3">
        <h1 class="text-xl font-semibold">Scrape Anything</h1>
        <span class="text-sm text-gray-500">history &amp; artifacts</span>
      </header>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-[minmax(280px,360px)_1fr]">
        <aside>
          <input
            id="search"
            type="search"
            name="q"
            placeholder="Search sessions…"
            class="mb-3 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm dark:border-gray-600"
            hx-get="/ui/sessions"
            hx-trigger="keyup changed delay:300ms, search"
            hx-target="#list"
          />
          <div id="list" hx-get="/ui/sessions" hx-trigger="load"></div>
        </aside>

        <main
          id="detail"
          class="min-h-[300px] rounded-lg border border-gray-200 p-4 dark:border-gray-700"
        >
          <p class="text-sm text-gray-500">
            Select a session to view its transcript and artifacts.
          </p>
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
