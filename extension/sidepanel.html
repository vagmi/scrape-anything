<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scrape Anything</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body class="h-screen m-0 flex flex-col bg-bg text-fg font-sans antialiased">
    <header class="shrink-0 border-b border-line px-3 py-2">
      <div class="flex items-center gap-2">
        <div class="flex min-w-0 flex-1 items-center gap-2">
          <img id="page-favicon" class="hidden size-4 shrink-0 rounded-sm" alt="" />
          <p id="page-kind" class="m-0 truncate text-xs text-muted">Detecting page…</p>
        </div>
        <a id="session-link" class="btn btn-ghost hidden" target="_blank" rel="noopener" title="Open this session in the dashboard">
          Dashboard
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3" /></svg>
        </a>
        <button id="new-session" class="btn btn-ghost" title="Start a new session">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          New
        </button>
      </div>
      <p id="tab-warning" class="hidden m-0 mt-2 flex items-center gap-2 rounded-md bg-warn-soft px-2.5 py-1.5 text-xs text-warn">
        <span class="flex-1">You're viewing a different tab from the session's.</span>
        <button id="show-session-tab" class="cursor-pointer border-0 bg-transparent p-0 text-xs font-medium text-warn underline underline-offset-2">Show it</button>
      </p>
    </header>

    <main id="scroll" class="flex-1 min-h-0 overflow-y-auto px-3 py-4">
      <div id="empty" class="flex h-full flex-col items-center justify-center px-4 text-center">
        <div class="mb-3 flex size-10 items-center justify-center rounded-full bg-accent-soft text-accent">
          <svg class="icon size-5" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><path d="M7 8h10" /><path d="M7 12h10" /><path d="M7 16h6" /></svg>
        </div>
        <p class="m-0 text-sm font-medium">Extract data from this page</p>
        <p class="m-0 mt-1 max-w-[260px] text-xs leading-relaxed text-muted">
          Describe what you want. The agent explores the page, writes an extractor,
          and can follow pagination. Results download as JSON or CSV.
        </p>
      </div>
      <section id="transcript" class="hidden flex flex-col gap-3"></section>
    </main>

    <footer class="shrink-0 px-3 pb-3 pt-2">
      <section id="results" class="hidden mb-2 flex items-center gap-2 rounded-lg border border-line bg-surface px-3 py-2">
        <svg class="icon text-ok" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>
        <span id="results-count" class="flex-1 truncate text-xs font-medium">—</span>
        <button id="dl-json" class="btn btn-outline" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></svg>
          JSON
        </button>
        <button id="dl-csv" class="btn btn-outline" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></svg>
          CSV
        </button>
      </section>

      <label id="composer-label" for="message" class="mb-1.5 block text-xs font-medium text-muted">
        What do you want extracted?
      </label>
      <div class="composer">
        <textarea
          id="message"
          rows="3"
          placeholder="e.g. all upcoming tech events with title, url, and start time"
        ></textarea>
        <div class="flex items-center gap-2 px-2 pb-2">
          <span class="flex-1 pl-1 text-[11px] text-muted">⌘ ↵ to send</span>
          <button id="stop" class="btn btn-danger hidden">
            <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
            Stop
          </button>
          <button id="send" class="btn btn-primary">Scrape</button>
        </div>
      </div>

      <p id="status"></p>
    </footer>

    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
