<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scrape Anything</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body
    class="h-screen m-0 p-4 box-border flex flex-col bg-white text-gray-900 text-lg font-sans"
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
  >
    <header class="shrink-0">
      <div class="flex justify-between items-baseline gap-2">
        <h1 class="m-0 text-xl font-semibold">Scrape Anything</h1>
        <button
          id="new-session"
          class="bg-transparent border-0 p-0 text-base text-[var(--color-accent)] cursor-pointer hover:underline"
        >
          New session
        </button>
      </div>
      <p id="page-kind" class="m-0 mt-1 text-sm text-gray-500">Detecting page…</p>
      <p id="tab-warning" class="hidden m-0 mt-1 text-sm text-amber-700">
        You're viewing a different tab from the session's.
        <button
          id="show-session-tab"
          class="bg-transparent border-0 p-0 text-sm text-[var(--color-accent)] cursor-pointer hover:underline"
        >Show it</button>
      </p>
    </header>

    <section
      id="transcript"
      class="hidden mt-3 flex-1 min-h-0 flex flex-col gap-3 overflow-y-auto pr-1"
    ></section>

    <section
      id="results"
      class="hidden shrink-0 mt-3 flex items-center justify-between gap-2 rounded-md border border-gray-200 bg-gray-50 px-3 py-2"
    >
      <span id="results-count" class="text-base text-gray-700">—</span>
      <span class="flex gap-2">
        <button
          id="dl-json"
          class="rounded-md border border-gray-300 bg-white px-2.5 py-1 text-sm cursor-pointer hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
          disabled
        >JSON</button>
        <button
          id="dl-csv"
          class="rounded-md border border-gray-300 bg-white px-2.5 py-1 text-sm cursor-pointer hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
          disabled
        >CSV</button>
      </span>
    </section>

    <section id="composer" class="shrink-0 mt-auto pt-4 flex flex-col gap-2">
      <label id="composer-label" for="message" class="text-base text-gray-600">
        What do you want extracted?
      </label>
      <textarea
        id="message"
        rows="3"
        placeholder="e.g. all upcoming tech events with title, url, and start time"
        class="w-full resize-y rounded-md border border-gray-200 p-2.5 text-base
               focus:outline focus:outline-2 focus:outline-[var(--color-accent)] focus:-outline-offset-1"
      ></textarea>
      <div class="flex gap-2">
        <button
          id="send"
          class="flex-1 rounded-md border border-[var(--color-accent)]
                 bg-[var(--color-accent)] text-white px-3 py-2 text-base
                 cursor-pointer hover:brightness-95
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Plan &amp; run
        </button>
        <button
          id="stop"
          class="hidden rounded-md border border-red-300 bg-white text-red-600
                 px-3 py-2 text-base cursor-pointer hover:bg-red-50
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Stop
        </button>
      </div>
    </section>

    <p id="status" class="shrink-0 m-0 mt-3 min-h-[20px] text-sm text-gray-500"></p>

    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
