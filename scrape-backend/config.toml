[server]
host = "127.0.0.1"
port = 4546

[storage]
path = "./scrape.db"

[llm]
# Max LLM steps per user request (resets on each follow-up message).
max_turns = 100
max_refinements = 3
request_timeout_secs = 60
# Retry transient model failures (502/503/504/500/429, dropped connections)
# with exponential backoff: 1s, 2s, 4s… capped at retry_max_delay_ms.
max_retries = 3
retry_base_delay_ms = 1000
retry_max_delay_ms = 8000
# A provider that exhausted its retries (or kept answering with nothing) is
# skipped for this long; steps go straight to the next provider meanwhile.
failover_cooldown_secs = 300

# Providers, in priority order. Each step goes to the first one that isn't
# cooling down; if it stays down, rejects the request or returns an empty
# answer, the next one takes over mid-session. API keys come from the
# environment (default var per kind, or `api_key_env`); a provider whose key
# isn't set is skipped at startup with a warning.
#
# kind: gemini | anthropic | openai | meta | deepseek | mistral | openrouter |
#       xai | groq | ollama | openai_compatible (needs base_url)
# reasoning_effort (optional): zero | minimal | low | medium | high | max
[[llm.providers]]
kind = "gemini"            # GEMINI_API_KEY
model = "gemini-3.8-flash"
reasoning_effort = "low"   # replaces the old disable-thinking genai fork

[[llm.providers]]
kind = "meta"              # META_API_KEY — Meta Model API (Muse Spark)
model = "muse-spark-1.3-contributor-edition"


[cors]
allowed_origins = ["chrome-extension://*"]

[dashboard]
# React Router SPA build served at http://localhost:4546/ (see ../dashboard).
dist_path = "../dashboard/build/client"

# Per-host route normalization overrides (see SPEC §9).
[[routes]]
host = "lu.ma"
patterns = [
  { match = "^/[^/]+$", replace = "/:slug" },
]

[sandbox]
# Docker sandbox for file analysis. Build the image first:
#   docker build -t scrape-sandbox:0.1 sandbox
# Without the image the backend still runs; `run_command` is just not offered.
enabled = true
image = "scrape-sandbox:0.1"
# Session workspaces (sessions/<id>/ → /work in the container) and staged uploads.
data_dir = "./data"
memory = "1g"
cpus = "1"
pids_limit = 512
command_timeout_secs = 30
max_command_timeout_secs = 120
max_output_bytes = 32768
idle_ttl_secs = 1800
max_upload_bytes = 104857600
