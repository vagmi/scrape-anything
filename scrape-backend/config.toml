[server]
host = "127.0.0.1"
port = 4546

[storage]
path = "./scrape.db"

[llm]
provider = "gemini"
model = "gemini-3-flash-preview"
# GEMINI_API_KEY is read from the environment, not this file.
max_turns = 50
max_refinements = 3
request_timeout_secs = 60

[cors]
allowed_origins = ["chrome-extension://*"]

[dashboard]
# Static Vite build served at http://localhost:4546/ (see ../dashboard).
dist_path = "./dashboard/dist"

# Per-host route normalization overrides (see SPEC §9).
[[routes]]
host = "lu.ma"
patterns = [
  { match = "^/[^/]+$", replace = "/:slug" },
]
